<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://dabel.vercel.app/" />
    <meta name="description" content="dabel — all-in-one labelling for audio and image challenges. Host a queue, invite labellers, and compare consensus." />
    <meta property="og:title" content="dabel — all-in-one labelling" />
    <meta property="og:description" content="Audio and image challenges. Host a queue, invite labellers, and compare consensus." />
    <meta property="og:url" content="https://dabel.vercel.app/" />
    <meta property="og:image" content="https://dabel.vercel.app/epstein-simpsons.jpeg" />
    <title>dabel — all-in-one labelling</title>
    <!-- Light unless the visitor chose dark with the toggle; stamped before first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('epstein-files-theme') === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
